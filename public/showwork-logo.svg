<svg width="160" height="40" viewBox="0 0 160 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Logo Icon Container -->
  <g transform="translate(0, 0)">
    <!-- Background with rounded corners -->
    <rect x="0" y="0" width="40" height="40" rx="12" ry="12" fill="#1e3a8a" filter="url(#glow)"/>
    
    <!-- Loading bar at top -->
    <rect x="0" y="0" width="40" height="4" rx="12" ry="12" fill="url(#logoGradient)"/>
    
    <!-- Code Symbol: < / > -->
    <text 
      x="20" 
      y="26" 
      font-family="Courier New, monospace" 
      font-size="14" 
      font-weight="bold" 
      fill="#ffffff" 
      text-anchor="middle" 
      letter-spacing="-1px"
      style="text-shadow: 0 0 5px rgba(30, 58, 138, 0.4);">
      &lt; / &gt;
    </text>
  </g>
  
  <!-- ShowWork Text -->
  <text 
    x="52" 
    y="26" 
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
    font-size="20" 
    font-weight="bold" 
    fill="#334155" 
    letter-spacing="-0.5px">
    ShowWork
  </text>
</svg>

